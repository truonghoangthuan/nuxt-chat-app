[package]
name = "my-team"
version = "0.10.1"
description = "My Team - Lightweight resilient encrypted real-time chat workspace"
authors = ["My Team"]
edition = "2021"

[lib]
name = "my_team_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
